name: reliquary
version: "0.3.4"
description: "Local Reliquary memory and source provenance with Hermes-owned inference and an interactive relationship graph."
author: Lokee86
kind: exclusive
requires_hermes: ">=0.23.0"
python_dependencies:
  - "jsonschema>=4,<5"
provides_tools: []
provides_hooks:
  - on_session_delete
provides_middleware: []
requires_env: []
config_schema:
  RELIQUARY_HERMES_TOKEN:
    type: secret
    env: RELIQUARY_HERMES_TOKEN
    description: "Profile-scoped local host token, provisioned during memory setup."
