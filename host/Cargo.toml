[package]
name = "reliquary-hermes-host"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
resolver = "3"

[dependencies]
getrandom = "0.4"
httparse = "1"
reliquary-memory = { path = "../../Reliquary" }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tempfile = "3"

[patch.crates-io]
quinn-proto = { path = "../../Reliquary/vendor/quinn-proto" }
