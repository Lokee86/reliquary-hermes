[package]
name = "reliquary-switchboard"
version = "0.1.0"
edition = "2024"
publish = false

[features]
test-support = []

[dependencies]
base64 = "0.22"
hex = "=0.4.3"
reqwest = { version = "=0.12.23", default-features = false, features = ["blocking", "rustls-tls", "json"] }
ring = "=0.17.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust"] }
