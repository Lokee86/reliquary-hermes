name: Native host

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the stable Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Restore locked Cargo dependencies and compiler output
        id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cargo-home
            host/target
          key: windows-native-v2-release-o1-${{ hashFiles('host/Cargo.lock', 'vendor/reliquary/**/*.rs', 'vendor/reliquary/**/Cargo.toml', 'vendor/lodestone/**/*.rs', 'vendor/lodestone/**/Cargo.toml') }}
      - name: Build the Windows host (release)
        timeout-minutes: 30
        shell: pwsh
        run: |
          $env:CARGO_PROFILE_RELEASE_OPT_LEVEL = '1'
          $repo = $env:GITHUB_WORKSPACE
          $env:CARGO_HOME = Join-Path $repo '.cargo-home'
          $env:CARGO_TARGET_DIR = Join-Path $repo 'host\target'
          $scratch = Join-Path $repo 'host\.test-tmp\native-ci'
          New-Item -ItemType Directory -Force -Path $env:CARGO_HOME, $scratch | Out-Null
          $env:TEMP = $scratch
          $env:TMP = $scratch
          $env:TMPDIR = $scratch
          cargo build --manifest-path host/Cargo.toml --locked --release -j 2
          if ($LASTEXITCODE -ne 0) { throw "Cargo release build failed with exit code $LASTEXITCODE." }
      - name: Test the Windows host (release)
        timeout-minutes: 10
        shell: pwsh
        run: |
          $env:CARGO_PROFILE_RELEASE_OPT_LEVEL = '1'
          $repo = $env:GITHUB_WORKSPACE
          $env:CARGO_HOME = Join-Path $repo '.cargo-home'
          $env:CARGO_TARGET_DIR = Join-Path $repo 'host\target'
          $scratch = Join-Path $repo 'host\.test-tmp\native-ci'
          New-Item -ItemType Directory -Force -Path $env:CARGO_HOME, $scratch | Out-Null
          $env:TEMP = $scratch
          $env:TMP = $scratch
          $env:TMPDIR = $scratch
          cargo test --manifest-path host/Cargo.toml --locked --release -j 2 -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw "Cargo release tests failed with exit code $LASTEXITCODE." }
      - name: Save partial Cargo cache after a trusted run
        if: ${{ always() && github.event_name != 'pull_request' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cargo-home
            host/target
          key: windows-native-v2-release-o1-${{ hashFiles('host/Cargo.lock', 'vendor/reliquary/**/*.rs', 'vendor/reliquary/**/Cargo.toml', 'vendor/lodestone/**/*.rs', 'vendor/lodestone/**/Cargo.toml') }}
      - name: Upload the Windows host
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reliquary-hermes-host-windows-x86_64
          path: host/target/release/reliquary-hermes-host.exe
          if-no-files-found: error
          retention-days: 14
      - name: Attest the Windows host build
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: host/target/release/reliquary-hermes-host.exe

  unix:
    name: Native host (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/host/target
      CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      HOST_TARGET: ${{ matrix.target }}
    steps:
      - name: Check out the pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the stable Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Restore locked Cargo dependencies and compiler output
        id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cargo-home
            host/target
          key: unix-native-release-o1-${{ matrix.target }}-${{ hashFiles('host/Cargo.lock', 'vendor/reliquary/**/*.rs', 'vendor/reliquary/**/Cargo.toml', 'vendor/lodestone/**/*.rs', 'vendor/lodestone/**/Cargo.toml') }}
      - name: Set up the native test directory
        shell: bash
        run: |
          scratch="$(pwd -P)/host/.test-tmp/native-ci"
          mkdir -p "$scratch"
          printf 'TMPDIR=%s\n' "$scratch" >> "$GITHUB_ENV"
      - name: Build the native host
        timeout-minutes: 30
        shell: bash
        run: |
          rustc -vV
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$HOST_TARGET"
          cargo build --manifest-path host/Cargo.toml --locked --release --target "$HOST_TARGET" -j 2
      - name: Test the native host
        timeout-minutes: 10
        shell: bash
        run: cargo test --manifest-path host/Cargo.toml --locked --release --target "$HOST_TARGET" -j 2 -- --test-threads=1
      - name: Save partial Cargo cache after a trusted run
        if: ${{ always() && github.event_name != 'pull_request' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cargo-home
            host/target
          key: unix-native-release-o1-${{ matrix.target }}-${{ hashFiles('host/Cargo.lock', 'vendor/reliquary/**/*.rs', 'vendor/reliquary/**/Cargo.toml', 'vendor/lodestone/**/*.rs', 'vendor/lodestone/**/Cargo.toml') }}
