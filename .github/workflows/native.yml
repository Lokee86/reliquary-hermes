name: Native host

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: Install (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-22.04
          - target: linux-arm64
            runner: ubuntu-22.04-arm
          - target: macos-amd64
            runner: macos-15-intel
          - target: macos-arm64
            runner: macos-15
            surface: --desktop
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: Lokee86/hermes-agent
          ref: 2ae307e7a37ab12501d972e101b5d89a19c500e5
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Resolve the Hermes release baseline
        shell: bash
        run: |
          git fetch --no-tags https://github.com/NousResearch/hermes-agent.git refs/tags/v0.23.0:refs/tags/v0.23.0
          test "$(git rev-parse 'v0.23.0^{}')" = 2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19
      - name: Set up the Hermes bootstrap Python on Ubuntu 22.04
        if: runner.os == 'Linux'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Check Apple Silicon host detection under Rosetta
        if: matrix.target == 'macos-arm64'
        shell: bash
        run: |
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 /usr/bin/python3 -B -c 'from hermes_platform.host.facts import native_arch, process_arch; assert process_arch() == "amd64"; assert native_arch() == "arm64"'
          else
            echo 'Rosetta is unavailable on this runner.'
          fi
      - name: Prepare Hermes from this checkout
        uses: ./.github/actions/setup-pm
        with:
          toolchain: python
          extras: '[]'
          test-environment: ${{ matrix.target == 'linux-amd64' && 'true' || 'false' }}
      - name: Check catalog install and update transactions
        if: matrix.target == 'linux-amd64'
        shell: bash
        run: |
          bash scripts/run_tests.sh tests/hermes_cli/test_plugins_cmd_catalog.py tests/hermes_cli/test_plugin_native_assets.py \
            -k 'native_host_publishes or catalog_native_asset_selection' -q -j 2
      - name: Install and run the published host
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
          _TARGET: ${{ matrix.target }}
          _SURFACE: ${{ matrix.surface }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$_SURFACE" ]; then args+=("$_SURFACE"); fi
          "$HERMES_PYTHON" -m scripts.ci.reliquary_catalog_native_smoke \
            plugin-catalog/reliquary.yaml "$_TARGET" "${args[@]}"
