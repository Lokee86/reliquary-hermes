name: Stock Hermes catalog proof
on:
  workflow_dispatch:
    inputs:
      catalog_pin:
        description: Exact Reliquary commit with four attested native hosts
        type: string
        required: true

permissions:
  contents: read

jobs:
  catalog:
    name: Stock install (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
          - platform: macos-x86_64
            runner: macos-15-intel
          - platform: macos-arm64
            runner: macos-15
    env:
      CATALOG_PIN: ${{ inputs.catalog_pin }}
      HOST_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Confirm the proof branch carries the exact runtime tree
        shell: bash
        run: |
          [[ "$CATALOG_PIN" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=1 origin "$CATALOG_PIN"
          git diff --exit-code "$CATALOG_PIN" HEAD -- src tests host plugin.yaml
      - name: Install and start the exact pin with stock Hermes
        shell: bash
        run: bash scripts/ci/smoke-bundled-catalog.sh "$HOST_PLATFORM"
