name: Native host

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix:
    name: Native host (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/host/target
      CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      HOST_PLATFORM: ${{ matrix.platform }}
      HOST_TARGET: ${{ matrix.target }}
    steps:
      - name: Check out the published v0.3.0 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/v0.3.0
          persist-credentials: false
      - name: Restore the host from the verified v0.3.0 build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          commit=0ad300940c0d6d77d39ad0078ab0a8674dd421b5
          test "$(git rev-parse HEAD)" = "$commit"
          scratch="$(pwd -P)/host/.test-tmp/native-ci"
          incoming="$scratch/compiled-package"
          mkdir -p "$incoming" "$CARGO_TARGET_DIR/$HOST_TARGET/release"
          gh run download 44628246577 --repo "$GITHUB_REPOSITORY" \
            --name "reliquary-hermes-$HOST_PLATFORM" --dir "$incoming"
          archive="reliquary-hermes-v0.3.0-$HOST_PLATFORM.zip"
          (cd "$incoming" && shasum -a 256 -c "$archive.sha256")
          gh attestation verify "$incoming/$archive" --repo "$GITHUB_REPOSITORY" \
            --source-digest "$commit" --source-ref refs/heads/release/native-platforms \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/native.yml" --deny-self-hosted-runners
          ditto -x -k "$incoming/$archive" "$incoming"
          install -m 0755 "$incoming/reliquary/host/reliquary-hermes-host" \
            "$CARGO_TARGET_DIR/$HOST_TARGET/release/reliquary-hermes-host"
          printf 'TMPDIR=%s\n' "$scratch" >> "$GITHUB_ENV"
      - name: Prepare the platform package
        shell: bash
        run: |
          root="$TMPDIR/package"
          plugin="$root/reliquary"
          mkdir -p "$plugin"
          git archive HEAD | tar -xf - -C "$plugin"
          host="$plugin/host/reliquary-hermes-host"
          install -m 0755 "$CARGO_TARGET_DIR/$HOST_TARGET/release/reliquary-hermes-host" "$host"
          version="$(sed -n 's/^version: "\([^"]*\)"$/\1/p' "$plugin/plugin.yaml")"
          test -n "$version"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          if [[ "$RUNNER_OS" == Linux ]]; then
            extension=tar.gz
            readelf -d "$host" | sed -n 's/.*Shared library: \[\([^]]*\)\].*/\1/p' > "$plugin/NATIVE-REQUIREMENTS.txt"
          else
            extension=zip
          fi
          printf 'PACKAGE_ROOT=%s\nPACKAGE_ARCHIVE=%s\n' "$root" \
            "$TMPDIR/reliquary-hermes-v$version-$HOST_PLATFORM.$extension" >> "$GITHUB_ENV"
      - name: Package the native host
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            tar -czf "$PACKAGE_ARCHIVE" -C "$PACKAGE_ROOT" reliquary
          else
            codesign --force --sign - "$PACKAGE_ROOT/reliquary/host/reliquary-hermes-host"
            ditto -c -k --keepParent "$PACKAGE_ROOT/reliquary" "$PACKAGE_ARCHIVE"
          fi
      - name: Set up Python for the packaged-host test
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Test the extracted platform package
        timeout-minutes: 10
        shell: bash
        run: |
          profile="$(mktemp -d "$TMPDIR/reliquary-profile.XXXXXX")"
          mkdir -p "$profile/plugins"
          if [[ "$RUNNER_OS" == Linux ]]; then
            tar -xzf "$PACKAGE_ARCHIVE" -C "$profile/plugins"
          else
            # Model the quarantine marker on a browser download and use the release's Terminal extraction.
            xattr -w com.apple.quarantine "0083;$(printf '%x' "$(date +%s)");Safari;" "$PACKAGE_ARCHIVE"
            ditto -x -k "$PACKAGE_ARCHIVE" "$profile/plugins"
            spctl --status
            if xattr -p com.apple.quarantine "$profile/plugins/reliquary/host/reliquary-hermes-host" 2>/dev/null; then
              echo 'The extracted executable carries the archive quarantine marker.'
            else
              echo 'Terminal extraction left the executable without a quarantine marker.'
            fi
          fi
          plugin="$profile/plugins/reliquary"
          host="$plugin/host/reliquary-hermes-host"
          test -x "$host"
          arch="${HOST_TARGET%%-*}"
          if [[ "$RUNNER_OS" == Linux ]]; then
            case "$arch" in
              x86_64) machine='Advanced Micro Devices X86-64' ;;
              aarch64) machine='AArch64' ;;
            esac
            readelf -h "$host" | grep -F "$machine"
            glibc="$(readelf --version-info "$host" | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sort -V | tail -1)"
            printf 'Required glibc: %s\n' "$glibc"
            test "$(printf '%s\n' GLIBC_2.35 "$glibc" | sort -V | tail -1)" = GLIBC_2.35
            libraries="$(ldd "$host")"
            printf '%s\n' "$libraries"
            [[ "$libraries" != *'not found'* ]]
          else
            if [[ "$arch" == aarch64 ]]; then arch=arm64; fi
            test "$(lipo -archs "$host")" = "$arch"
            test "$(xcrun vtool -show-build "$host" | awk '$1 == "minos" { print $2 }')" = "$MACOSX_DEPLOYMENT_TARGET"
            codesign --verify --strict --verbose=2 "$host"
            codesign --display --verbose=4 "$host" 2>&1 | grep -Fx 'Signature=adhoc'
          fi
          python -B -S "$plugin/tests/smoke_packaged_host.py" "$profile"
          cd "$(dirname "$PACKAGE_ARCHIVE")"
          archive="$(basename "$PACKAGE_ARCHIVE")"
          shasum -a 256 "$archive" > "$archive.sha256"
      - name: Upload the tested platform package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reliquary-hermes-${{ matrix.platform }}
          path: |
            ${{ env.PACKAGE_ARCHIVE }}
            ${{ env.PACKAGE_ARCHIVE }}.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Attest the platform package
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: ${{ env.PACKAGE_ARCHIVE }}
